<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Small World Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <button class="frames-btn" id="frames-btn" type="button" aria-label="Show all frames">Frames</button>
  <div class="panel-backdrop" id="panel-backdrop"></div>
  <div class="stage">
    <aside class="panel" id="panel"></aside>
    <div class="device-wrap" id="device-wrap">
      <div class="device" id="device"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
